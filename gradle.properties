# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric
minecraft_version=26.2
loader_version=0.19.5
fabric_version=0.159.0+26.2
modmenu_version=20.0.1

# Mod
mod_version=1.0.0
maven_group=dev.mirosys
archives_base_name=logai

# Optional: nach dem Build wird das Jar in diesen mods-Ordner kopiert.
# Leer lassen und stattdessen in der benutzerweiten Datei setzen:
#   ~/.gradle/gradle.properties  ->  mods_dir=/pfad/zur/instanz/mods
mods_dir=

# Minecraft 26.2 braucht Java 25, und Fabric Loom verlangt, dass Gradle selbst
# darauf laeuft. Entweder JAVA_HOME auf ein JDK 25 zeigen lassen, oder in der
# benutzerweiten Datei setzen:
#   ~/.gradle/gradle.properties  ->  org.gradle.java.home=/pfad/zum/jdk-25
