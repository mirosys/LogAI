# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric
minecraft_version=26.2
loader_version=0.19.5
fabric_version=0.159.0+26.2
modmenu_version=20.0.1

# Mod
mod_version=0.1.0-beta
maven_group=dev.mirosys
archives_base_name=logai

# Optional: after a build the jar is copied into this mods folder.
# Leave it empty here and set it in your own ~/.gradle/gradle.properties instead:
#   mods_dir=/path/to/instance/mods
mods_dir=

# Minecraft 26.2 needs Java 25, and Fabric Loom needs Gradle itself to run on it.
# Either point JAVA_HOME at a JDK 25, or set it in ~/.gradle/gradle.properties:
#   org.gradle.java.home=/path/to/jdk-25
