plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.20'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

dependencies {
	// Minecraft 26.x wird unobfuskiert ausgeliefert, deshalb gibt es hier keine Mappings
	// und keine remap-Konfigurationen mehr.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Nur fuers Kompilieren des Einstellungs-Einstiegs, LogAI laeuft auch ohne Mod Menu.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Kopiert das fertige Jar direkt in die Minecraft-Instanz, damit man sofort starten kann.
tasks.register('copyToMods', Copy) {
	def target = project.findProperty('mods_dir')
	onlyIf { target != null && !target.toString().isBlank() }
	dependsOn tasks.named('jar')
	from tasks.named('jar')
	into target != null && !target.toString().isBlank()
			? file(target.toString())
			: layout.buildDirectory.dir("unused")
}

tasks.named('build') {
	finalizedBy 'copyToMods'
}

// Optionaler Testkomfort: Nach dem Build die Mod-Konfiguration der Testinstanz loeschen,
// damit der Einrichtungsablauf beim naechsten Start wieder von vorn laeuft. Passiert nur,
// wenn 'logai_config' gesetzt ist - sinnvollerweise in ~/.gradle/gradle.properties, damit
// niemand anderes beim Bauen seine Einstellungen verliert.
tasks.register('resetLogAIConfig') {
	def target = project.findProperty('logai_config')
	onlyIf { target != null && !target.toString().isBlank() }

	doLast {
		def file = file(target.toString())

		if (file.exists()) {
			file.delete()
			logger.lifecycle("LogAI: reset ${file}")
		}
	}
}

tasks.named('copyToMods') {
	finalizedBy 'resetLogAIConfig'
}
