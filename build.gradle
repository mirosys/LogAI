plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.20'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

dependencies {
	// Minecraft 26.x ships unobfuscated, so there are no mappings and no remapping here.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Only needed to compile the settings entrypoint; LogAI runs without Mod Menu.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

def modsDir = project.findProperty('mods_dir')?.toString()?.trim()
def configFile = project.findProperty('logai_config')?.toString()?.trim()
def jarName = { "${project.base.archivesName.get()}-${project.version}.jar" }

// Copies the finished jar into a Minecraft instance, so a test is one launch away.
// Set mods_dir in ~/.gradle/gradle.properties; the project file leaves it empty.
tasks.register('copyToMods', Copy) {
	onlyIf { modsDir }
	dependsOn tasks.named('jar')
	from tasks.named('jar')
	into modsDir ? file(modsDir) : layout.buildDirectory.dir("unused")

	// Fabric refuses to start when it finds the same mod twice, so older jars of this
	// mod have to go before the new one lands.
	doFirst {
		file(modsDir).listFiles()?.each { existing ->
			def ours = existing.name.startsWith("${project.base.archivesName.get()}-")
					&& existing.name.endsWith('.jar')

			if (ours && existing.name != jarName()) {
				if (existing.delete()) {
					logger.lifecycle("LogAI: removed stale ${existing.name}")
				} else {
					logger.warn("LogAI: could NOT remove ${existing.name} - close Minecraft, "
							+ "otherwise Fabric will refuse to start with two versions of the mod")
				}
			}
		}
	}
}

// Test convenience: delete the mod's config after a build so the setup runs again on the
// next start. Only when logai_config is set - keep it in ~/.gradle/gradle.properties, so
// nobody else loses their settings by building this project.
tasks.register('resetLogAIConfig') {
	onlyIf { configFile }

	doLast {
		def target = file(configFile)

		if (target.exists() && target.delete()) {
			logger.lifecycle("LogAI: reset ${target}")
		}
	}
}

tasks.named('build') {
	finalizedBy 'copyToMods'
}

tasks.named('copyToMods') {
	finalizedBy 'resetLogAIConfig'
}
